# ---------------------------------------------------------------------------
# buun-llama-cpp -- Windows x64 build (v2)
#
#   ui-build                  -> llama-ui.zip
#   windows-cpu (release)     -> full exe bundle   [preferred]
#   windows-cpu (no-openmp)   -> full exe bundle   [fallback variant]
#   windows-cuda-x64          -> ggml-cuda.dll + cudart runtime
#   package                   -> one ready-to-run release zip
#
# Derived from .github/workflows/release.yml in spiritbuun/buun-llama-cpp.
# ---------------------------------------------------------------------------
# WHAT CHANGED FROM v1, AND WHY  (nothing else was touched)
#
# 1. runner_cpu now defaults to `windows-2025` instead of `windows-2025-vs2026`.
#    - The windows-2025 image ships exactly LLVM 20.1.8, which is the version
#      ggml/src/CMakeLists.txt hard-pins for GGML_OPENMP_FETCH:
#          set(GGML_OPENMP_LLVM_VERSION "20.1.8")
#          if (NOT GGML_OPENMP_COMPILER_VERSION_MAJOR STREQUAL 20)
#              message(FATAL_ERROR "LLVM OpenMP 20.1.8 requires Clang 20.x")
#    - The vs2026 preview image additionally bundles its own clang inside Visual
#      Studio (component VC.Llvm.Clang 18.9.12009.112). Any `call vcvarsall.bat`
#      puts that bundled clang ahead of LLVM 20.1.8 on PATH.
#
# 2. The `call vcvarsall.bat` line is gone.
#    Upstream's own Windows CPU CI (.github/workflows/build-cpu.yml, job
#    `windows`, on windows-2025) builds with plain clang and never calls
#    vcvarsall. Dropping it removes both the dependency on the VS18 preview path
#    and the "which clang wins on PATH" question.
#
# 3. The build is split into Configure / Build and the complete output is saved
#    to configure.log / build.log, then uploaded as an artifact even on failure
#    (`if: always()`), together with fingerprint.log and CMakeError.log. A
#    failing run is now diagnosable without needing a GitHub login to read logs.
#
# 4. New `Environment fingerprint` step records clang / cmake / ninja / 7z
#    versions and the resolved Visual Studio path.
#
# 5. The CPU job now runs two variants in parallel (fail-fast disabled):
#      release   : -DGGML_OPENMP=ON  -DGGML_OPENMP_FETCH=ON   (as in release.yml)
#      no-openmp : -DGGML_OPENMP=OFF -DGGML_OPENMP_FETCH=OFF  (as in upstream CI's
#                  GGML_CPU_ALL_VARIANTS variant, which deliberately turns OpenMP off)
#    If one variant fails, the other still supplies the executables. The package
#    job prefers `release` and falls back to `no-openmp`.
# ---------------------------------------------------------------------------
name: Build Windows x64 (CUDA)

on:
  # manual only -- nothing runs by itself after you fork
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'CUDA toolkit version. 13.3 = native Blackwell/sm_120 (RTX 50xx).'
        required: true
        default: '13.3'
        type: choice
        options:
          - '13.3'
          - '13.1'
          - '12.4'
      runner_cpu:
        description: 'Runner image for the exe build. windows-2025 ships LLVM 20.1.8 = the version ggml pins.'
        required: true
        default: 'windows-2025'
        type: choice
        options:
          - 'windows-2025'
          - 'windows-2025-vs2026'
          - 'windows-2022'

env:
  GH_TOKEN: ${{ github.token }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  # exactly as in the upstream release workflow -- drops examples/tests, keeps tools+server
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=OFF"

jobs:
  # -------------------------------------------------------------------------
  # 1. Build the web UI (embedded into llama-server later). Reuses the repo's
  #    own reusable workflow, unmodified. Needs no secrets.
  # -------------------------------------------------------------------------
  ui-build:
    uses: ./.github/workflows/ui-build.yml

  # -------------------------------------------------------------------------
  # 2. Main bundle: every executable + base DLLs + CPU backend variants.
  #    Two variants in parallel; either one alone is enough for the package.
  # -------------------------------------------------------------------------
  windows-cpu-x64:
    name: windows-cpu (${{ matrix.variant }})
    needs: [ui-build]
    runs-on: ${{ inputs.runner_cpu }}

    permissions:
      actions: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: 'release'
            tag: ''
            openmp: 'ON'
            fetch_openmp: 'ON'
          - variant: 'no-openmp'
            tag: '-noopenmp'
            openmp: 'OFF'
            fetch_openmp: 'OFF'

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download UI build
        uses: actions/download-artifact@v7
        with:
          name: llama-ui.zip
          path: tools/ui/dist

      - name: Install Ninja
        run: |
          choco install ninja

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: win-x64-cpu-${{ matrix.variant }}-${{ inputs.runner_cpu }}

      # -- records what we are actually building with; plain text, no gates ---
      - name: Environment fingerprint
        shell: cmd
        run: |
          echo == runner == > fingerprint.log
          echo ImageOS=%ImageOS% RUNNER_OS=%RUNNER_OS% PROCESSORS=%NUMBER_OF_PROCESSORS% >> fingerprint.log
          echo == clang == >> fingerprint.log
          where clang >> fingerprint.log 2>&1
          clang --version >> fingerprint.log 2>&1
          echo == clang++ == >> fingerprint.log
          clang++ --version >> fingerprint.log 2>&1
          echo == cmake == >> fingerprint.log
          cmake --version >> fingerprint.log 2>&1
          echo == ninja == >> fingerprint.log
          ninja --version >> fingerprint.log 2>&1
          echo == 7z == >> fingerprint.log
          where 7z >> fingerprint.log 2>&1
          echo == visual studio == >> fingerprint.log
          "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath >> fingerprint.log 2>&1
          echo == PATH clang entries == >> fingerprint.log
          echo %PATH% | find /i "llvm" >> fingerprint.log 2>&1
          type fingerprint.log
          exit /b 0

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DGGML_OPENMP=${{ matrix.openmp }} ^
            -DGGML_OPENMP_FETCH=${{ matrix.fetch_openmp }} ^
            %CMAKE_ARGS% > configure.log 2>&1
          set RC=%ERRORLEVEL%
          type configure.log
          exit /b %RC%

      - name: Build
        shell: cmd
        run: |
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          if %NINJA_JOBS% LSS 1 set NINJA_JOBS=1
          cmake --build build --config Release -j %NINJA_JOBS% > build.log 2>&1
          set RC=%ERRORLEVEL%
          powershell -NoProfile -Command "Get-Content build.log -Tail 250"
          exit /b %RC%

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          7z a -snl llama-bin-win-cpu-x64${{ matrix.tag }}.zip .\build\bin\Release\*

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-bin-win-cpu-x64${{ matrix.tag }}.zip
          name: llama-bin-win-cpu-x64${{ matrix.tag }}.zip
          retention-days: 7

      # -- always, so a failed run still tells us exactly why it failed ------
      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-cpu-${{ matrix.variant }}
          path: |
            configure.log
            build.log
            fingerprint.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # 3. CUDA backend only. llama-server comes from the cpu bundle above --
  #    that is how upstream splits it too.
  #    Unchanged from release.yml: windows-2022 runner, MSVC, GGML_CPU=OFF.
  # -------------------------------------------------------------------------
  windows-cuda-x64:
    name: windows-cuda (${{ inputs.cuda_version }}, x64)
    runs-on: windows-2022

    permissions:
      actions: write

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ inputs.cuda_version }}
          cuda_arch: x64

      - name: Install Ninja
        run: |
          choco install ninja

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: win-x64-cuda-${{ inputs.cuda_version }}

      - name: Build
        id: cmake_build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=OFF ^
            -DGGML_CUDA=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ${{ inputs.cuda_version == '12.4' && '-DGGML_CUDA_CUB_3DOT2=ON' || '' }}
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target ggml-cuda

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          7z a -snl llama-bin-win-cuda-${{ inputs.cuda_version }}-x64.zip .\build\bin\Release\ggml-cuda.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-bin-win-cuda-${{ inputs.cuda_version }}-x64.zip
          name: llama-bin-win-cuda-${{ inputs.cuda_version }}-x64.zip
          retention-days: 7

      - name: Copy and pack Cuda runtime (x64)
        run: |
          echo "Cuda install location: ${{ env.CUDA_PATH }}"
          $dst='.\build\bin\cudart\'
          robocopy "${{env.CUDA_PATH}}\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          robocopy "${{env.CUDA_PATH}}\lib" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          robocopy "${{env.CUDA_PATH}}\bin\x64" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          7z a cudart-llama-bin-win-cuda-${{ inputs.cuda_version }}-x64.zip $dst\*

      - name: Upload Cuda runtime
        uses: actions/upload-artifact@v6
        with:
          path: cudart-llama-bin-win-cuda-${{ inputs.cuda_version }}-x64.zip
          name: cudart-llama-bin-win-cuda-${{ inputs.cuda_version }}-x64.zip
          retention-days: 7

  # -------------------------------------------------------------------------
  # 4. Merge everything into one flat, ready-to-run folder and zip it.
  # -------------------------------------------------------------------------
  package:
    name: package (single release zip)
    needs: [windows-cpu-x64, windows-cuda-x64]
    # run even when one of them failed -- the script reports exactly what is missing
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: raw

      - name: Merge into one folder
        run: |
          set -uo pipefail
          mkdir -p stage dist

          echo "== downloaded =="
          find raw -type f | head -40

          # `download-artifact` puts each artifact in its own folder whose name
          # equals the artifact name, so the file itself sits one level deeper.
          # -type f matters: without it `find` matches that folder too.
          # prefer the full variant, fall back to the no-openmp one.
          CPU_ZIP=""
          for cand in llama-bin-win-cpu-x64.zip llama-bin-win-cpu-x64-noopenmp.zip; do
            found=$(find raw -type f -name "$cand" -print -quit)
            if [ -n "$found" ]; then CPU_ZIP="$found"; break; fi
          done
          CUDA_ZIP=$(find raw -type f -name 'llama-bin-win-cuda-*.zip' -print -quit)
          CUDART_ZIP=$(find raw -type f -name 'cudart-llama-bin-win-cuda-*.zip' -print -quit)

          echo "cpu   : $CPU_ZIP"
          echo "cuda  : $CUDA_ZIP"
          echo "cudart: $CUDART_ZIP"

          [ -n "$CPU_ZIP" ]    || { echo "ERROR: no CPU exe bundle artifact found";    exit 1; }
          [ -n "$CUDA_ZIP" ]   || { echo "ERROR: no CUDA backend artifact found";      exit 1; }
          [ -n "$CUDART_ZIP" ] || { echo "ERROR: no cudart runtime artifact found";    exit 1; }

          unzip -q -o "$CPU_ZIP"    -d stage/cpu
          unzip -q -o "$CUDA_ZIP"   -d stage/cuda
          unzip -q -o "$CUDART_ZIP" -d stage/cudart

          # the 7z archives store build/... prefixed paths -- find the real exe dir
          EXEDIR=$(dirname "$(find stage/cpu -iname 'llama-server.exe' -print -quit | head -n1)")
          if [ -z "${EXEDIR}" ] || [ "${EXEDIR}" = "." ]; then
            EXEDIR=$(find stage/cpu -type d -exec sh -c 'n=$(find "$1" -maxdepth 1 -iname "*.exe" | wc -l); echo "$n $1"' _ {} \; \
                     | sort -rn | head -n1 | cut -d' ' -f2-)
          fi
          echo "exe dir: $EXEDIR"
          cp -f "$EXEDIR"/* dist/

          # flatten every DLL next to the executables (this fixes the
          # build/bin/cudart/ layout inside the cudart archive)
          find stage/cuda   -iname '*.dll' -exec cp -f {} dist/ \;
          find stage/cudart -iname '*.dll' -exec cp -f {} dist/ \;
          if [ -f LICENSE ]; then cp -f LICENSE dist/; fi

          # sanity check -- fail loudly rather than ship a broken package
          test -f dist/llama-server.exe || { echo "ERROR: llama-server.exe missing"; ls -la dist; exit 1; }
          test -f dist/ggml-cuda.dll    || { echo "ERROR: ggml-cuda.dll missing";    ls -la dist; exit 1; }
          echo "== dist =="
          ls -la dist

      - name: Add README and launcher
        run: |
          set -euo pipefail

          cat > dist/README.txt <<'EOF'
          buun-llama-cpp -- Windows x64 + CUDA
          ====================================

          Portable build. Every executable and DLL sits flat in this folder.
          No installer, no CUDA Toolkit install required -- the runtime DLLs are bundled.

          Quick start
          -----------
          1. Put a GGUF model file somewhere, e.g. D:\models\model.gguf
          2. Start the API server:
               llama-server.exe -m D:\models\model.gguf -ngl 999 -c 8192
             then open http://127.0.0.1:8080
             (or drag the .gguf file onto run-server.cmd)
          3. Or just chat in the terminal:
               llama-cli.exe -m D:\models\model.gguf -ngl 999

          Useful flags
          ------------
            -ngl N    layers to offload to the GPU; 999 = all
            -c N      context size
            -fa       enable flash attention

          About
          -----
          * Built from source by GitHub Actions from: spiritbuun/buun-llama-cpp
          * ggml-cuda.dll      = CUDA backend
          * cudart64_*.dll, cublas64_*.dll, cublasLt64_*.dll = CUDA runtime
          * Requires a recent NVIDIA driver. CUDA Toolkit is NOT required.
          * The fork's headline features (VBR / TCQ KV cache) require the CUDA backend.
          * License: see LICENSE
          EOF

          printf '@echo off\r\nsetlocal\r\nif "%%~1"=="" (\r\n  echo Usage: drag a .gguf file onto this script, or pass a path:\r\n  echo        run-server.cmd D:\\models\\model.gguf\r\n  pause\r\n  exit /b 1\r\n)\r\n"%%~dp0llama-server.exe" -m "%%~1" -ngl 999 -c 8192 %%2 %%3 %%4 %%5\r\n' > dist/run-server.cmd

          echo "== final =="
          ls -la dist

      - name: Zip the package
        run: |
          set -euo pipefail
          PKG="buun-llama-cpp-win-x64-cuda${{ inputs.cuda_version }}"
          (cd dist && zip -q -r "../${PKG}.zip" .)
          ls -la "${PKG}.zip"
          sha256sum "${PKG}.zip" > "${PKG}.zip.sha256"
          cat "${PKG}.zip.sha256"

      - name: Upload the release package
        uses: actions/upload-artifact@v6
        with:
          path: |
            buun-llama-cpp-win-x64-cuda${{ inputs.cuda_version }}.zip
            buun-llama-cpp-win-x64-cuda${{ inputs.cuda_version }}.zip.sha256
          name: buun-llama-cpp-win-x64-cuda${{ inputs.cuda_version }}
          retention-days: 30
